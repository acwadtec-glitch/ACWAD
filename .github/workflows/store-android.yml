name: Android (Google Play)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['store/**','index.html']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: store}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - run: npm ci
      - run: npm run sync
      - name: Decode keystore (if provided)
        env: {KEYSTORE_B64: '${{ secrets.ANDROID_KEYSTORE_B64 }}'}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV; fi
      - name: Build debug APK (installable for testing)
        working-directory: store/android
        run: ./gradlew assembleDebug
      - name: Build release AAB (upload this to Google Play)
        working-directory: store/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            store/android/app/build/outputs/apk/debug/*.apk
            store/android/app/build/outputs/bundle/release/*.aab
      - name: Publish builds to the 'builds' branch
        run: |
          mkdir -p /tmp/out && cp android/app/build/outputs/bundle/release/*.aab android/app/build/outputs/apk/debug/*.apk /tmp/out/
          cd /tmp/out && git init -q -b builds && git config user.name github-actions && git config user.email actions@github.com
          git add -A && git commit -qm "Android builds from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin builds
